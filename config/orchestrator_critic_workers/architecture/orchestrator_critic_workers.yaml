# Orchestrator + Critic + Workers Architecture
# Human-in-the-loop simulation with System 2 thinking.
# Critic validates plans before worker execution.

experiment_name: "orchestrator_critic_workers"
log_to_wandb: true
wandb_project: "malo-lang-orch-critic-w-maloben"

environment:
  docker_image: "malo:latest"
  setup_commands: []
  timeout_seconds: 600

architecture: "orchestrator_critic_workers"

limits:
  max_turns: 50
  recursion_limit: 2000
  max_cost_usd: 5.00
  observation_truncation_chars: 5000
  max_message_chars: null
  worker_max_turns: 10
  random_seed: null
  max_workers: 3
  worker_timeout_seconds: 300
  challenge_timeout_seconds: 1800

agents:

  orchestrator:
    model: "google/gemini-3-flash-preview"
    temperature: 0.2
    prompts_file: "../prompts/orchestrator.yaml"

  critic:
    model: "google/gemini-3-flash-preview"
    temperature: 0.2
    prompts_file: "../prompts/critic.yaml"
    strictness: "high"

  worker:
    model: "google/gemini-3-flash-preview"
    temperature: 0.2
    prompts_file: "../prompts/worker.yaml"
